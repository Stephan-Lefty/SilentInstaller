name: Tests

# Läuft bei jeder Änderung am Quelltext oder am Katalog – und vor jeder
# Veröffentlichung, weil ein Fehler dort alle Benutzer gleichzeitig trifft.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  logik:
    name: Logik und Katalog
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: GTK-Anbindung bereitstellen
        # Die Prüfungen selbst brauchen keine Oberfläche, wohl aber der
        # Import der Fenster-Module – so fallen auch dort Fehler auf.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1

      - name: Fassung anzeigen
        run: |
          python3 --version
          python3 -c "import silentinstaller; print('SilentInstaller', silentinstaller.__version__)"

      - name: Alle Module lassen sich übersetzen
        run: python3 -m compileall -q silentinstaller

      - name: Auch die Oberfläche lässt sich laden
        # Ohne Bildschirm, aber der Import allein deckt Tippfehler auf.
        run: |
          python3 - <<'PY'
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Adw", "1")
          import silentinstaller.window, silentinstaller.editor
          import silentinstaller.uihelpers, silentinstaller.app
          print("Oberflächenmodule geladen")
          PY

      - name: Tests
        run: python3 -m unittest discover -s tests -v

      - name: Shell-Skripte prüfen
        run: |
          for datei in silentinstaller.sh install.sh build-deb.sh; do
            bash -n "$datei" && echo "  $datei: Syntax in Ordnung"
          done
          sh -n apt-quellen-reparieren.sh && echo "  apt-quellen-reparieren.sh: Syntax in Ordnung"

      - name: Menüeintrag prüfen
        run: |
          sudo apt-get install -y -qq --no-install-recommends desktop-file-utils
          sed 's|@EXEC@|/usr/bin/silentinstaller|' \
            data/de.stephanlefty.SilentInstaller.desktop > /tmp/probe.desktop
          desktop-file-validate /tmp/probe.desktop

  paket:
    name: Debian-Paket bauen und auspacken
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Bauwerkzeuge
        # Gebaut wird gegen Debian 13 - das haben die Anwender, und
        # GuideOS baut darauf auf. Auf ubuntu-latest zu prüfen hieße,
        # gegen andere Paketnamen zu bauen.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential debhelper lintian

      - name: Paket bauen
        # **Mit dpkg-buildpackage, nicht mehr von Hand.** Angeregt am
        # 06.11.2026 vom Admin der GuideOS-Distribution: Nur so kann
        # eine Distribution das Paket nachbauen und aufnehmen. Die
        # Paketquellen liegen in debian/.
        run: |
          dpkg-buildpackage -us -uc
          mkdir -p dist
          mv ../silentinstaller_*.deb dist/

      - name: Was lintian sagt
        # Blockierend: Eine Prüfung, die nie rot wird, liest niemand.
        # Der erste Lauf am 06.11.2026 fand vier Befunde, darunter ein
        # totes Abhängigkeitspaket (policykit-1 gibt es in Debian 13
        # nicht mehr).
        run: lintian --no-tag-display-limit --fail-on warning dist/*.deb

      - name: Inhalt prüfen
        # Ein Paket, dem eine Datei fehlt, fällt sonst erst beim Benutzer auf.
        run: |
          DATEI=$(ls dist/*.deb)
          echo "Gebaut: $DATEI"
          dpkg-deb --info "$DATEI"
          for pfad in \
            ./usr/bin/silentinstaller \
            ./usr/share/applications/de.stephanlefty.SilentInstaller.desktop \
            ./usr/share/silentinstaller/silentinstaller/app.py \
            ./usr/share/silentinstaller/silentinstaller/data/catalog.json \
            ./usr/share/icons/hicolor/48x48/apps/de.stephanlefty.SilentInstaller.png \
            ./usr/share/doc/silentinstaller/copyright \
            ./usr/share/doc/silentinstaller/changelog.gz \
            ./usr/share/man/man1/silentinstaller.1.gz \
            ./usr/share/metainfo/de.stephanlefty.SilentInstaller.metainfo.xml
          do
            dpkg-deb --contents "$DATEI" | grep -q " $pfad\$" \
              && echo "  vorhanden: ${pfad#./}" \
              || { echo "  FEHLT: ${pfad#./}"; exit 1; }
          done

      - name: Paket wirklich installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/*.deb
          dpkg-query -W -f='installiert: ${binary:Package} ${Version}\n' silentinstaller

      - name: Startet der Paketinhalt?
        run: |
          sudo apt-get install -y -qq --no-install-recommends xvfb dbus-x11
          cat > /tmp/start.py <<'PY'
          import sys
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Adw", "1")
          from gi.repository import Adw, GLib
          sys.path.insert(0, "/usr/share/silentinstaller")
          from silentinstaller.app import SilentInstallerApp

          app = SilentInstallerApp()

          def pruefen():
              fenster = app._window
              if fenster is None:
                  print("FEHLER: kein Fenster")
                  sys.exit(1)
              print("Fenster:", fenster.get_title())
              print("Einträge:", len(fenster.catalog.apps))
              app.quit()
              return False

          app.connect("activate", lambda a: GLib.timeout_add(1500, pruefen))
          sys.exit(app.run([]))
          PY
          xvfb-run -a dbus-run-session -- python3 /tmp/start.py

      - name: Alle Startwege prüfen
        # Der Aufruf über einen Verweis war einmal kaputt – seitdem geprüft.
        run: |
          xvfb-run -a timeout 15 silentinstaller & sleep 8
          pgrep -af "python3 /usr/bin/silentinstaller" > /dev/null \
            && echo "  Start über /usr/bin: läuft" \
            || { echo "  Start über /usr/bin: SCHEITERT"; exit 1; }
          pkill -f "/usr/bin/silentinstaller" || true

      - name: Paket wieder entfernen
        run: sudo apt-get remove -y silentinstaller

      - name: Paket als Beiwerk sichern
        uses: actions/upload-artifact@v4
        with:
          name: debian-paket
          path: dist/*.deb
          retention-days: 14
